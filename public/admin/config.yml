# Keep every field here in sync with src/content.config.ts.

backend:
  name: github
  repo: IzukoGaen/hazelrolweb
  branch: main
  base_url: https://sveltia-cms-auth.vm567734.workers.dev

# Images live under src/ so Astro can optimise them. Sveltia requires the
# top-level folders to be absolute; each collection below overrides them with
# a path relative to its own folder, which is the form Astro's image() needs.
media_folder: /src/assets/uploads

# Astro's .optional() rejects the empty strings Sveltia would otherwise save.
output:
  omit_empty_optional_fields: true

locale: es

collections:
  - name: settings
    label: Ajustes
    media_folder: ../../assets/uploads
    public_folder: ../../assets/uploads
    files:
      - name: profile
        label: Perfil y textos
        file: src/content/settings/profile.json
        fields:
          - { name: name, label: Nombre, widget: string }
          - { name: language, label: "Idioma (código, ej. es)", widget: string }
          - name: seo
            label: Buscadores (SEO)
            widget: object
            fields:
              - { name: title, label: Título en Google y en la pestaña, widget: string, hint: "Empieza con tu nombre. Ideal: menos de 60 caracteres." }
              - { name: description, label: Descripción en Google, widget: text, hint: "Incluye tu nombre, qué estudias y dónde. Ideal: 120 a 160 caracteres." }
              - { name: siteName, label: Nombre del sitio, widget: string, hint: "Cómo quieres que Google nombre el sitio, ej. Hazel Rol." }
              - { name: alternateNames, label: Otros nombres del sitio, widget: list, hint: "Formas en que la gente podría buscarte, ej. Hazel Rol Web." }
              - { name: jobTitle, label: Profesión o puesto, widget: string }
              - { name: university, label: Universidad, widget: string }
              - { name: city, label: Ciudad, widget: string }
              - { name: country, label: País, widget: string }
              - { name: locale, label: "Idioma y región (ej. es_MX)", widget: string }
              - { name: shareImage, label: "Imagen al compartir el enlace (1200×630 ideal)", widget: image, required: false, hint: "Si la dejas vacía se usa tu retrato." }
              - { name: shareImageAlt, label: Descripción de la imagen al compartir, widget: string, required: false }
              - { name: googleVerification, label: Código de verificación de Google Search Console, widget: string, required: false, hint: "Solo el valor de content del meta tag que te da Google." }
          - name: nav
            label: Menú
            widget: object
            fields:
              - { name: work, label: Proyectos, widget: string }
              - { name: about, label: Sobre mí, widget: string }
              - { name: services, label: Servicios, widget: string }
              - { name: contact, label: Contacto, widget: string }
              - { name: cta, label: Botón del menú, widget: string }
              - { name: menu, label: "Nombre del menú (para lectores de pantalla)", widget: string }
              - { name: skipLink, label: "Enlace «saltar al contenido» (para teclado)", widget: string }
          - name: hero
            label: Portada
            widget: object
            fields:
              - { name: eyebrow, label: Texto superior, widget: string }
              - { name: tagline, label: Lema corto, widget: string }
              - { name: status, label: Disponibilidad, widget: string }
              - { name: intro, label: Presentación, widget: text }
              - { name: statement, label: Frase principal, widget: text, hint: "Pon *asteriscos* alrededor de una palabra para resaltarla en cursiva." }
              - { name: scrollLabel, label: Texto del enlace a proyectos, widget: string }
          - name: skills
            label: Habilidades (cinta animada)
            widget: list
            field: { name: skill, label: Habilidad, widget: string }
          - name: about
            label: Sobre mí
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: lead, label: Frase destacada, widget: text, hint: "Pon *asteriscos* alrededor de una palabra para resaltarla en cursiva." }
              - name: paragraphs
                label: Párrafos
                widget: list
                field: { name: paragraph, label: Párrafo, widget: text }
              - name: facts
                label: Datos
                widget: list
                fields:
                  - { name: label, label: Etiqueta, widget: string }
                  - { name: value, label: Valor, widget: string }
              - { name: portrait, label: Retrato, widget: image, required: false }
              - { name: portraitAlt, label: Descripción del retrato, widget: string, required: false }
          - name: work
            label: Sección de proyectos
            widget: object
            fields:
              - { name: heading, label: Título, widget: string, hint: "Pon *asteriscos* alrededor de una palabra para resaltarla en cursiva." }
              - { name: intro, label: Introducción, widget: text }
          - name: services
            label: Servicios
            widget: object
            fields:
              - { name: heading, label: Título, widget: string, hint: "Pon *asteriscos* alrededor de una palabra para resaltarla en cursiva." }
              - { name: intro, label: Introducción, widget: text }
              - name: items
                label: Servicios
                widget: list
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descripción, widget: text }
              - name: stats
                label: Números
                widget: list
                fields:
                  - { name: value, label: Número, widget: string }
                  - { name: label, label: Etiqueta, widget: string }
          - name: contact
            label: Contacto
            widget: object
            fields:
              - { name: heading, label: Título, widget: string, hint: "Pon *asteriscos* alrededor de una palabra para resaltarla en cursiva." }
              - { name: email, label: Correo, widget: string }
              - name: socials
                label: Redes
                widget: list
                fields:
                  - { name: label, label: Nombre, widget: string }
                  - { name: url, label: Enlace, widget: string }
              - name: cv
                label: CV (PDF)
                widget: file
                required: false
                media_folder: /public/files
                public_folder: /files
              - { name: cvLabel, label: Texto del enlace al CV, widget: string }
              - { name: sealMessage, label: Mensaje al sellar la carta (al hacer clic en el correo), widget: string }
          - name: footer
            label: Pie de página
            widget: object
            fields:
              - { name: note, label: Nota, widget: string }
              - { name: backToTop, label: Texto "volver arriba", widget: string }
          - name: skyDial
            label: Reloj del cielo (Sky Dial)
            widget: object
            fields:
              - { name: label, label: "Nombre del control (para lectores de pantalla)", widget: string }
              - { name: night, label: "Noche (20:00–5:00)", widget: string }
              - { name: dawn, label: "Amanecer (5:00–8:00)", widget: string }
              - { name: day, label: "Día (8:00–17:00)", widget: string }
              - { name: sunset, label: "Atardecer (17:00–20:00)", widget: string }

      - name: theme
        label: Diseño
        file: src/content/settings/theme.json
        fields:
          - name: accent
            label: Color de acento
            widget: select
            options:
              - { label: Cinnamoroll (azul cielo), value: cinnamoroll }
              - { label: Rosa, value: pink }
              - { label: Amarillo, value: yellow }
              - { label: Lavanda, value: periwinkle }
          - name: dialColor
            label: Color del reloj del cielo
            widget: select
            options:
              - { label: Rosa, value: rosa }
              - { label: Celeste, value: celeste }
          - { name: showSkyDial, label: Mostrar el reloj del cielo, widget: boolean }
          - { name: showCat, label: Mostrar el gatito, widget: boolean }
          - { name: catName, label: Nombre del gatito (aparece al tocarlo), widget: string, required: false }
          - name: sections
            label: Secciones (arrastra para reordenar)
            widget: list
            allow_add: false
            allow_remove: false
            summary: "{{fields.id}} — visible: {{fields.visible}}"
            fields:
              - name: id
                label: Sección
                widget: select
                options:
                  - { label: Portada, value: hero }
                  - { label: Habilidades, value: skills }
                  - { label: Sobre mí, value: about }
                  - { label: Proyectos, value: work }
                  - { label: Servicios, value: services }
                  - { label: Contacto, value: contact }
              - { name: visible, label: Visible, widget: boolean }

  - name: projects
    label: Proyectos
    label_singular: Proyecto
    folder: src/content/projects
    media_folder: ../../assets/uploads
    public_folder: ../../assets/uploads
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, year, title]
    fields:
      - { name: title, label: Título, widget: string }
      - { name: category, label: Categoría, widget: string }
      - { name: year, label: Año, widget: number, value_type: int }
      - { name: summary, label: Resumen, widget: text }
      - { name: resultValue, label: Resultado (número), widget: string, required: false }
      - { name: resultLabel, label: Resultado (texto), widget: string, required: false }
      - { name: cover, label: Portada, widget: image, required: false }
      - { name: coverAlt, label: Descripción de la portada, widget: string, required: false }
      - { name: order, label: Orden, widget: number, value_type: int, default: 0 }
      - { name: draft, label: Borrador, widget: boolean, default: false }
      - { name: body, label: Caso de estudio, widget: markdown }
